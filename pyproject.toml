[project]
name = "astra_music"
version = "1.1.7"
description = "Music search and playback for Astra: Yandex Music and VK Music."
requires-python = ">=3.10"
dependencies = [
    "astra-plugin-sdk>=0.6,<0.7",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "httpx>=0.27,<1",
    "yandex-music>=2,<3",
    "pywebview>=6,<7",
    "soundcard>=0.4.5,<0.5",
    "numpy>=2,<3",
]

[project.optional-dependencies]
# `pip install -e ".[dev]"`, then `pytest`. The harness itself ships in the SDK,
# so this extra adds the runner and nothing else.
dev = ["pytest>=7.0", "pillow>=9.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
