[plugin]
id = "music-controller"
name = "Music Controller"
version = "1.3.1"
description = "Search Yandex Music, VK and Spotify; play tracks and playlists inside Astra with voice controls."
call_timeout_secs = 600
author = "Voltur"
license = "MIT"

[entry]
command = "python"
args = ["-m", "src.plugin"]
cwd = "."
runtimes = ["python", "node"]

# What the daemon may call INTO this plugin.
[capabilities]
tools = true
actions = true
ui_contributions = true
event_handlers = true

# Outbound host calls are default-deny. State events duck music while Astra
# speaks; the opt-in presenter uses Astra's chat for its spoken links.
# The tab still talks to its own process over CallFromUi, and account tokens
# remain in the plugin's data folder.
[permissions]
send_chat_message = { reason = "Optional radio presenter: announces songs using Astra's configured personality, model and voice only when enabled by the user" }
subscribe_events = { types = ["state_changed", "tts_started", "tts_completed", "tts_interrupted"], reason = "Temporarily lower the music player's volume while Astra listens or speaks, including optional radio announcements, then restore it" }

# Tokens are entered in the plugin's own tab and stored under
# %APPDATA%\music-controller\settings.json, so Astra shows no settings form.
[config]
schema = "{ \"type\": \"object\", \"properties\": {} }"

[platform]
os = ["linux", "windows"]
arch = ["x86_64"]
