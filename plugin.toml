[plugin]
id = "music-controller"
name = "Music Controller"
version = "1.1.3"
description = "Search Yandex Music and VK; play tracks and playlists inside Astra with voice controls."
call_timeout_secs = 600
author = "Voltur"
license = "MIT"

[entry]
command = "python"
args = ["-m", "src.plugin"]
cwd = "."
runtimes = ["python", "node"]

# What the daemon may call INTO this plugin.
[capabilities]
tools = true
actions = true
ui_contributions = true
event_handlers = true

# Outbound host calls are default-deny. The only host subscription used here
# delivers Astra's listening/speaking state so music volume can duck locally.
# The tab still talks to its own process over CallFromUi, and account tokens
# remain in the plugin's data folder.
[permissions]
subscribe_events = { types = ["state_changed"], reason = "Temporarily lower the music player's volume while Astra is listening, then restore it" }

# Tokens are entered in the plugin's own tab and stored under
# %APPDATA%\music-controller\settings.json, so Astra shows no settings form.
[config]
schema = "{ \"type\": \"object\", \"properties\": {} }"

[platform]
os = ["linux", "windows"]
arch = ["x86_64"]
