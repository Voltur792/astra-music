<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astra Music — очередь</title>
  <link rel="stylesheet" href="player-v12.css">
  <link rel="stylesheet" href="queue-window.css">
  <link rel="stylesheet" href="music-kit.css">
  <script src="music-kit-bridge.js"></script>
  <script src="queue-bridge.js?v=2"></script>
  <script src="native-bridge.js"></script>
  <link rel="stylesheet" href="widget-theme.css">
  <script src="widget-theme.js"></script>
</head>
<body class="queue-window" data-music-kit-loading>
  <p class="music-kit-loading" role="status">Загрузка очереди…</p>
  <main class="player">
    <section id="queuePanel" class="queue-panel" aria-label="Очередь воспроизведения">
      <header class="queue-header pywebview-drag-region">
        <strong id="queueTitle">Очередь воспроизведения</strong>
        <button id="queueClose" type="button" aria-label="Закрыть очередь"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      </header>
      <div id="queueList" class="queue-list" aria-label="Треки"></div>
      <p id="queueMessage" class="queue-message" role="status">Загружаю очередь…</p>
    </section>
  </main>
  <script src="queue.js"></script>
  <script src="music-kit.js"></script>
</body>
</html>
